[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "errington-gardening"
version = "0.1.0"
description = "Source-led gardening encyclopedia tools for Errington and Central Vancouver Island"
requires-python = ">=3.12"
dependencies = [
    "pypdf==6.14.2",
    "rapidocr-onnxruntime==1.4.4",
    "opencv-python==5.1.0.95",
    "numpy==2.5.5",
    "Pillow==13.0.0",
    "reportlab==5.0.0",
    "mistune==3.1.3",
    "pypdfium2==5.15.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
gardening = "gardening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "build", "dist"]
