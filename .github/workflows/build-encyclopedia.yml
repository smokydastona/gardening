name: Build Encyclopedia

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  research-links:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF metadata reader
        run: python -m pip install pypdf==6.14.2

      - name: Install local CLI
        run: python -m pip install --no-deps -e .

      - name: Check candidate research links
        run: gardening research validate

      - name: Inspect priority source metadata
        if: ${{ !cancelled() }}
        run: python3 inspect_research_sources.py

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-link-check
          if-no-files-found: error
          path: |
            build/research-link-check.json
            build/research-source-metadata.json

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .

      - name: Validate source inputs and record counts
        run: gardening validate

      - name: Validate authoritative data model
        run: python data_model.py

      - name: Run tests
        run: gardening test

      - name: Rebuild calendar transcription
        run: |
          python parse_errington_calendar.py
          python validate_pipeline.py

      - name: Build registers and publications
        run: |
          gardening build all
          python render_publication.py \
            --pdf Errington_Gardening_Encyclopedia.pdf \
            --output-dir build/pdf_qa/encyclopedia
          python render_publication.py \
            --pdf Errington_Monthly_Gardening_Guide.pdf \
            --output-dir build/pdf_qa/monthly
          python render_publication.py \
            --pdf Errington_Illustrated_Plant_Directory.pdf \
            --output-dir build/pdf_qa/directory
          python render_publication.py \
            --pdf Errington_Botanical_Illustration_Collection.pdf \
            --output-dir build/pdf_qa/botanical
          python render_publication.py \
            --pdf Errington_Educational_Figure_Collection.pdf \
            --output-dir build/pdf_qa/figures

      - name: Upload encyclopedia outputs
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-build
          if-no-files-found: error
          path: |
            Errington_Gardening_Encyclopedia.pdf
            Errington_Gardening_Encyclopedia_Compiled.md
            AUDIT_REPORT.md
            SOURCE_AUDIT.md
            SOURCE_SHA256SUMS.txt
            CALENDAR_REVIEW_REPORT.md
            PLANT_VERIFICATION_REPORT.md
            ILLUSTRATION_AUDIT.md
            PUBLICATION_QA_REPORT.md
            reports/IMPLEMENTATION_REGISTER.md
            reports/IMPLEMENTATION_FINAL_REPORT.md
            reports/CURRENT_RELEASE_STATUS.md
            reports/PLANT_SCOPE_RECONCILIATION.csv
            reports/VERIFICATION_AUDIT.json
            calendar_actions.csv
            calendar_review.csv
            plant_verification_register.csv
            ERRINGTON_MONTHLY_REFERENCE.md
            ERRINGTON_PLANT_CATALOG.md
            ERRINGTON_ILLUSTRATION_BRIEFS_AND_PROMPTS.md
            errington_illustration_briefs.csv
            plant_registry_enriched.csv
            plant_illustrations/illustration_manifest.csv
            plant_illustrations/illustration_asset_manifest.csv
            plant_illustrations/illustration_asset_manifest.md
            plant_illustrations/missing_illustrations.txt
            build/pdf_qa/
            Errington_Monthly_Gardening_Guide.pdf
            Errington_Illustrated_Plant_Directory.pdf
            Errington_Botanical_Illustration_Collection.pdf
            Errington_Educational_Figure_Collection.pdf
            ERRINGTON_COMPLETE_SUPPLEMENT.md
            plant_illustrations/concept_candidates/
            educational_figures/
