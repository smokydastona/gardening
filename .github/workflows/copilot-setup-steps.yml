name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements.lock.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements.lock.txt

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install project and Gemini dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt google-genai==3.6.1
          .venv/bin/python -m pip check
